<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0f10" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>yt-dual — 2 つ同時に再生</title>
    <script type="module" crossorigin src="/assets/index-DM9OHOkx.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B_t6LDoS.css">
  </head>
  <body>
    <!--
      A name strip and nothing else. Sign-in moved down into the row of controls, where it
      belongs — it is an action, and up here it was the tallest thing in a bar that was
      costing 59 of the tablet's 507 pixels to print one word.
    -->
    <header class="bar">
      <h1>yt-dual</h1>
      <span class="version" id="version"></span>
    </header>

    <main>
      <!--
        Everything that acts on the whole page, in one row.

        It used to be three rows stacked above the players — play/pause/reset, the count, the
        column choice — and on the tablet held sideways they spent 120 of 507 pixels before
        the first picture (operator, 2026-09-23: ごちゃついてるんでシンプルにして). A glyph
        stands wherever a glyph says it; words stay only where the word is the meaning, which
        is why 全部 is written out and the broom is not.
      -->
      <section class="tools">
        <button type="button" class="primary with-icon" id="playBoth" data-icon="play">全部</button>
        <button type="button" class="with-icon" id="pauseBoth" data-icon="pause">全部</button>
        <!--
          Emptying every slot. It asks twice rather than opening a dialog: one stray tap must
          not throw away twenty videos, and a dialog is one more thing to read.
        -->
        <button
          type="button"
          class="icon"
          id="resetAll"
          data-icon="trash"
          title="全枠リセット"
          aria-label="全枠リセット"
        ></button>

        <!--
          Every slot at once, covering the screen (operator, 2026-09-24: 複数画面の全画面表示).
          The per-slot ⛶ shows one picture with the rest playing unseen; this shows all of
          them, the page's own bars and buttons put away.
        -->
        <button
          type="button"
          class="icon"
          id="allFull"
          data-icon="grid"
          title="全部を全画面"
          aria-label="全部を全画面"
        ></button>

        <span class="tools-sep" aria-hidden="true"></span>

        <!--
          How many slots. The slider is for going a long way at once; the two buttons are for
          landing on the number you meant, which a thumb on a slider cannot reliably do.
        -->
        <button type="button" class="icon" id="countDown" data-icon="minus" aria-label="枠を 1 つ減らす"></button>
        <input
          type="range"
          id="countRange"
          min="1"
          max="20"
          step="1"
          value="2"
          aria-label="枠の数"
        />
        <button type="button" class="icon" id="countUp" data-icon="plus" aria-label="枠を 1 つ増やす"></button>
        <output id="countValue" for="countRange">2</output>
        <span class="count-unit">枠</span>

        <!--
          Left alone the grid works itself out from the count (9 becomes 3 by 3). This is for
          when the operator wants a shape the count would not have picked. A menu rather than
          five buttons: it is set once and then never looked at, and five buttons took a row.
        -->
        <select id="columnsSelect" aria-label="並びの列数" hidden>
          <option value="auto">並び 自動</option>
          <option value="2">2 列</option>
          <option value="3">3 列</option>
          <option value="4">4 列</option>
          <option value="5">5 列</option>
        </select>

        <!--
          Installed as a real app there is no reload button, so the only way to pick up a new
          build was to kill the app from the task switcher (operator, 2026-09-23: 毎回タスク
          キルするのが嫌だ). It wears a dot when a background check has already found one.
        -->
        <button
          type="button"
          class="icon"
          id="update"
          data-icon="refresh"
          title="更新を確認"
          aria-label="更新を確認"
        ></button>

        <!-- The operator's own YouTube, so a phone never has to type an id. -->
        <button type="button" id="signIn">ログイン</button>
      </section>

      <section class="library" id="library" hidden>
        <div class="library-bar">
          <button type="button" class="icon" id="libraryBack" data-icon="enter" aria-label="戻る" title="戻る" hidden></button>
          <strong id="libraryTitle"></strong>
          <button type="button" class="icon" id="libraryClose" data-icon="close" aria-label="閉じる" title="閉じる"></button>
        </div>
        <div class="library-tabs">
          <button type="button" data-tab="search" aria-pressed="false">検索</button>
          <button type="button" data-tab="playlists" aria-pressed="true">再生リスト</button>
          <button type="button" data-tab="subscriptions" aria-pressed="false">登録チャンネル</button>
          <button type="button" data-tab="liked" aria-pressed="false">高評価</button>
          <!--
            The nearest thing the API has to おすすめ. YouTube's own recommendations are built
            from watch history, and neither history nor recommendations have ever been
            reachable through the Data API — so this list is the same for everyone, and the
            label says so rather than promising something personal.
          -->
          <button type="button" data-tab="popular" aria-pressed="false">人気</button>
          <!--
            YouTube Music, as far as the API reaches it. Its songs are ordinary videos filed
            under the music category, so the players play them like any other video; this is
            the same chart as 人気, narrowed to that category.
          -->
          <button type="button" data-tab="music" aria-pressed="false">♪ 人気の曲</button>
        </div>
        <div class="library-search" id="librarySearchRow" hidden>
          <input type="search" id="librarySearchInput" placeholder="曲名や人の名前で探す" />
          <button
            type="button"
            id="librarySearchMusic"
            class="icon"
            data-icon="music"
            aria-pressed="false"
            aria-label="曲だけ探す"
            title="曲だけ探す (YouTube Music)"
          ></button>
          <button type="button" class="icon" id="librarySearchGo" data-icon="search" aria-label="探す" title="探す"></button>
        </div>
        <p class="library-note" id="libraryNote"></p>
        <ul class="library-list" id="libraryList"></ul>
      </section>

      <!--
        One slot, stamped out as many times as the screen needs. Twenty of these written by
        hand would be twenty places to forget the same edit.
      -->
      <template id="slotTemplate">
        <section class="slot" data-paste="off">
          <h2>
            <button type="button" class="slot-name" data-select></button>
            <span class="status" data-status></span>
          </h2>
          <!--
            The gesture sheet sits over the player because the YouTube frame swallows every
            touch that reaches it. It only takes touches while this slot is full screen.
          -->
          <div class="frame" data-fit="fit">
            <div data-mount></div>
            <!--
              Tap to start, ours rather than YouTube's.
              A slot that has not started yet is still YouTube's poster, and most of it is a
              link to youtube.com — so a tap meant to start the video left the app instead
              (operator, 2026-09-23). This covers the picture only until playing begins.
            -->
            <button type="button" class="frame-start" data-start aria-label="再生"></button>
            <div class="gesture" data-gesture>
              <button
                type="button"
                class="gesture-close"
                data-collapse
                data-icon="close"
                aria-label="全画面をやめる"
              ></button>
              <!--
                Nothing on screen says what the sheet does, so the first pause is where it
                gets explained. It shows itself while this slot is full screen and paused —
                the one moment nobody is watching the picture — and is gone on play.
              -->
              <div class="gesture-guide">
                <p class="gesture-guide-title">指の操作</p>
                <dl>
                  <dt>1 回叩く</dt><dd>操作を出す（出ている時は再生／一時停止）</dd>
                  <dt>2 回叩く</dt><dd>消音（左＝動画・右＝音楽・真ん中＝両方）</dd>
                  <dt>上半分を横に</dt><dd>再生位置</dd>
                  <dt>下半分を横に</dt><dd>速さ</dd>
                  <dt>縦になぞる</dt><dd>音量（左＝動画・右＝音楽・真ん中＝両方）</dd>
                  <dt>2 本指で広げる</dt><dd>画面いっぱいに映す</dd>
                  <dt>2 本指でつまむ</dt><dd>全体を映す</dd>
                  <dt>2 本指で横へ</dt><dd>隣の枠へ</dd>
                  <dt>2 本指で下へ</dt><dd>全画面をやめる</dd>
                </dl>
              </div>
              <p class="gesture-hint" data-hint aria-live="polite"></p>
              <!--
                The playback bar, only while this slot is full screen.
                YouTube's own bar is underneath the gesture sheet and cannot be reached, so
                full screen had no way to see where the video was or to jump inside it
                (operator, 2026-09-23). It fades with the other controls and comes back on a
                single tap.
              -->
              <!--
                Settings for the picture on screen, opened from ⚙ on the bar (operator,
                2026-09-24: 再生中タップした時にいろんな設定できるようにして). Every choice is
                a row of buttons rather than a menu: a menu opens the system picker, which
                covers the picture and needs a second tap to close.
              -->
              <div class="gesture-settings" data-settings hidden>
                <div class="gesture-settings-row">
                  <span>速さ</span>
                  <div class="chips" data-speed-chips></div>
                </div>
                <div class="gesture-settings-row">
                  <span>字幕</span>
                  <div class="chips">
                    <button type="button" data-set-captions aria-pressed="false">字幕</button>
                  </div>
                </div>
                <div class="gesture-settings-row">
                  <span>繰り返し</span>
                  <div class="chips">
                    <button type="button" data-set-loop aria-pressed="true">繰り返す</button>
                  </div>
                </div>
                <div class="gesture-settings-row">
                  <span>映し方</span>
                  <div class="chips">
                    <button type="button" data-set-fit="fit" aria-pressed="true">全体</button>
                    <button type="button" data-set-fit="fill" aria-pressed="false">画面いっぱい</button>
                  </div>
                </div>
              </div>
              <div class="gesture-bar" data-bar>
                <button
                  type="button"
                  data-bar-play
                  data-icon="play"
                  aria-label="再生／一時停止"
                ></button>
                <span class="gesture-time" data-elapsed>0:00</span>
                <input
                  type="range"
                  class="gesture-seek"
                  data-seek
                  min="0"
                  max="0"
                  step="1"
                  value="0"
                  aria-label="再生位置"
                />
                <span class="gesture-time" data-total>0:00</span>
                <button
                  type="button"
                  data-bar-captions
                  data-icon="captions"
                  aria-pressed="false"
                  aria-label="字幕"
                ></button>
                <button
                  type="button"
                  data-bar-settings
                  data-icon="settings"
                  aria-expanded="false"
                  aria-label="設定"
                ></button>
              </div>
            </div>
          </div>
          <!--
            Where an address is pasted. Folded away by default and opened by 🔗, because on a
            filled slot it is a wide box nobody types into — it holds an id that is already
            on screen above it. A slot with nothing in it opens it by itself, since that is
            the one moment it is the only way in.
          -->
          <div class="row paste">
            <input type="text" data-input placeholder="YouTube のアドレスか ID を貼る" />
            <button
              type="button"
              class="icon"
              data-load
              data-icon="enter"
              title="読み込む"
              aria-label="読み込む"
            ></button>
          </div>
          <!--
            One row for everything this slot does. It was three — play and pause, the
            toggles, then the volume on a line of its own — and on the tablet that put the
            bottom of a tall video past the edge of the screen. Play and pause are one button
            here for the same reason the full-screen bar has one: a video is either running
            or it is not, so two buttons meant one of them was always dead.
          -->
          <div class="row controls">
            <button
              type="button"
              class="icon"
              data-toggle
              data-icon="play"
              title="再生"
              aria-label="再生"
            ></button>
            <button
              type="button"
              class="icon"
              data-mute
              data-icon="muted"
              aria-pressed="false"
              title="消音"
              aria-label="消音"
            ></button>
            <button
              type="button"
              class="icon"
              data-loop
              data-icon="loop"
              aria-pressed="true"
              title="繰り返し"
              aria-label="繰り返し"
            ></button>
            <!-- Captions on and off, for whatever this slot is playing (operator, 2026-09-24). -->
            <button
              type="button"
              class="icon"
              data-captions
              data-icon="captions"
              aria-pressed="false"
              title="字幕"
              aria-label="字幕"
            ></button>
            <button
              type="button"
              class="icon"
              data-expand
              data-icon="expand"
              title="全画面"
              aria-label="全画面"
            ></button>
            <button
              type="button"
              class="icon"
              data-paste-toggle
              data-icon="link"
              aria-pressed="false"
              title="アドレスを貼る"
              aria-label="アドレスを貼る"
            ></button>
            <!--
              Search for this slot alone (operator, 2026-09-24). The picker opens on search and
              every result offers this slot and nothing else, so there is no "which slot?" left
              to answer after finding the video.
            -->
            <button
              type="button"
              class="icon"
              data-search
              data-icon="search"
              title="この枠で検索"
              aria-label="この枠で検索"
            ></button>
            <select data-speed aria-label="再生の速さ">
              <option value="0.25">0.25倍</option>
              <option value="0.5">0.5倍</option>
              <option value="0.75">0.75倍</option>
              <option value="1" selected>1倍</option>
              <option value="1.25">1.25倍</option>
              <option value="1.5">1.5倍</option>
              <option value="1.75">1.75倍</option>
              <option value="2">2倍</option>
            </select>
            <!--
              The slider and its reading are one item, not two. Left loose in the row the
              slider took all the slack and pushed the number onto a line of its own, which
              cost the slot 51px for three digits (measured 983x507, 2026-09-23).
            -->
            <label class="vol">
              <input type="range" min="0" max="100" step="1" data-volume aria-label="音量" />
              <output data-volume-value></output>
            </label>
          </div>
        </section>
      </template>

      <!--
        One handle per gap between columns, stamped out as the column count changes. Each one
        spans every row, because a column is the full height of the grid however many rows of
        slots are standing in it.
      -->
      <template id="splitTemplate">
        <div
          class="split"
          role="separator"
          aria-orientation="vertical"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="50"
          tabindex="0"
        ></div>
      </template>

      <div class="slots" id="slots"></div>

      <p class="note" id="note"></p>
    </main>

    <!--
      The way out of all-at-once full screen. It never fades: every touch on a picture goes to
      YouTube, so nothing could bring a faded button back.
    -->
    <button
      type="button"
      class="all-full-close"
      id="allFullClose"
      data-icon="close"
      hidden
      aria-label="全画面をやめる"
    ></button>

    <!-- Which slot is on screen during a full-screen swipe; filled in by app.ts. -->
    <div class="swipe-dots" id="swipeDots" hidden aria-hidden="true"></div>

  </body>
</html>
